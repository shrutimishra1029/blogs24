<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs24</title>

    <!-- Link your CSS file -->
    <script src="theme-init.js"></script>
    <script src="app-popup.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    

    <!-- Hamburger Menu Button -->
    <button class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Menu</h2>
        <button class="close-sidebar">&times;</button>
      </div>
      
      <!-- User Login Section -->
      <div class="sidebar-user" id="sidebar-user">
        <div id="user-logged-out">
          <button onclick="googleSignIn()" class="btn-login">
            🔐 Sign in with Google
          </button>
        </div>
        <div id="user-logged-in" style="display: none;">
          <img id="user-photo" src="" alt="Profile" class="user-avatar">
          <p id="user-name"></p>
          <button onclick="signOut()" class="btn-logout">Sign Out</button>
        </div>
      </div>
      
      <ul class="sidebar-menu">
  <li><a href="index.html">🏠 Home</a></li>
  <li><a href="profile.html">Profile</a></li>
  <li><a href="bookmarked.html">Saved Blogs</a></li>
  <li><a href="liked.html">Liked Blogs</a></li>
  <li><a href="subscription.html">Subscription</a></li>
  <li><a href="contact.html">Feedback/Contact Us</a></li>
  <li><a href="settings.html">Settings</a></li>
  
  <!-- Admin/Superadmin Only Options -->
  <li class="admin-only" style="display: none;"><a href="create-news.html">📝 Create Blog</a></li>
  <li class="admin-only" style="display: none;"><a href="manage-users.html">👥 Manage Users</a></li>
  <li class="admin-only" style="display: none;"><a href="analytics.html">📊 Blog Analytics</a></li>
</ul>
    </div>

    <!-- Header Top -->
    <div class="header-top">
        <div class="container">
            <div class="date"></div>
        </div>
    </div>

    <!-- Logo Section -->
    <div class="logo-section">
        <h1 class="site-brand">
            <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
                <path d="M33 5C20 6 9 11 7 20c-1 6 3 10 9 9 9-1 14-12 17-24Z"></path>
                <path d="M5 35c8-9 15-15 25-24M14 27l-1-8m8 1 6-1"></path>
            </svg>
            <span>Blogs24</span>
        </h1>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <button class="menu-toggle">Menu</button>
            <ul class="nav-menu">
                <li class="active"><a href="#">Latest</a></li>
                <li><a href="#">Entertainment</a></li>
                <li><a href="#">Sports</a></li>
                <li><a href="#">Politics</a></li>
                <li><a href="#">Technology</a></li>
                <li><a href="#">Business</a></li>
                <li><a href="#">Health</a></li>
                <li><a href="#">Lifestyle</a></li>  
            </ul>
        </div>
    </nav>

    <!-- Search Bar -->
<div class="search-container">
    <div class="container">
        <div class="search-bar">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search blogs by title..." 
                autocomplete="off"
            >
            <button id="search-btn" class="search-btn">Search</button>
            <button id="clear-search-btn" class="clear-btn" style="display: none;">✕ Clear</button>
        </div>
    </div>
</div>

<!-- Main Content Area -->
<div id="content-area" class="container">
    <!-- Dynamic news content will be loaded here by ja.js -->
</div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Firebase Authentication -->
    <script src="firebase-auth.js"></script>

    <!-- Shared Sidebar Script -->
    <script src="sidebar.js"></script>


    <!-- Your existing script -->
    <script src="ja.js"></script> 

</body>
</html>
