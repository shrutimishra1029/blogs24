<!DOCTYPE html>
<html lang="en">
<head>

      <ul class="sidebar-menu">
        <li><a href="index.html">🏠 Home</a></li>

        <li><a href="bookmarked.html">Saved Blogs</a></li>
        <li><a href="liked.html">Liked Blogs</a></li>

        <li><a href="settings.html">Settings</a></li>

<a href="index.html" class="btn-back-arrow" title="Back to Home" aria-label="Back to Home"><span aria-hidden="true">←</span></a>

        <p style="color: #666; font-size: 1.1rem;">Your favorite blogs</p>
    </div>
    
    <div id="liked-container">
        <p style="text-align: center; color: #999;">Loading liked blogs...</p>
    </div>
</div>
